name: Aurora Nifty 200 Daily Scanner

on:
  schedule:
    - cron: "0 17 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

  
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aurora-nifty200-pages
  cancel-in-progress: false

jobs:

  scan-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Aurora Nifty 200 scanner
        run: |
          python scanner/aurora_scanner.py

      - name: Commit updated scanner data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_results.json

          if git diff --cached --quiet; then
            echo "No scanner data changes to commit."
          else
            git commit -m "Update Aurora Nifty 200 scanner data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp app.js _site/

          mkdir -p _site/data
          cp data/latest_results.json _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
